services:

  postgres:
    image: postgres:16-alpine
    container_name: devops_postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__USER:-devops_user}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD:-devops_secret_password}
      POSTGRES_DB: ${APP_CONFIG__DB__NAME:-devops_db}
      POSTGRES_MULTIPLE_DATABASES: "users_db,products_db,orders_db"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:${APP_CONFIG__DB__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro,z
      - ./backups:/backups:z
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USER:-devops_user} -d ${APP_CONFIG__DB__NAME:-devops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  redis:
    image: redis:7-alpine
    container_name: devops_redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${APP_CONFIG__REDIS__PASSWORD:-devops_redis_password}
    command: >
      --requirepass ${APP_CONFIG__REDIS__PASSWORD:-devops_redis_password}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save 60 1
    ports:
      - "127.0.0.1:${APP_CONFIG__REDIS__PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${APP_CONFIG__REDIS__PASSWORD:-devops_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    container_name: devops_users
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__NAME: users_db
      APP_CONFIG__DB__USER: ${APP_CONFIG__DB__USER:-devops_user}
      APP_CONFIG__DB__PASSWORD: ${APP_CONFIG__DB__PASSWORD:-devops_secret_password}
      APP_CONFIG__LOG__DIR: /logs
      PYTHONPATH: /app
    volumes:
      - ./logs:/logs:z
    ports:
      - "${USERS_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devops_network

  products:
    build:
      context: ./services/products
      dockerfile: Dockerfile
    container_name: devops_products
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__NAME: products_db
      APP_CONFIG__DB__USER: ${APP_CONFIG__DB__USER:-devops_user}
      APP_CONFIG__DB__PASSWORD: ${APP_CONFIG__DB__PASSWORD:-devops_secret_password}
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__LOG__DIR: /logs
      PYTHONPATH: /app
    volumes:
      - ./logs:/logs:z
    ports:
      - "${PRODUCTS_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devops_network

  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: devops_orders
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__NAME: orders_db
      APP_CONFIG__DB__USER: ${APP_CONFIG__DB__USER:-devops_user}
      APP_CONFIG__DB__PASSWORD: ${APP_CONFIG__DB__PASSWORD:-devops_secret_password}
      APP_CONFIG__SERVICES__USERS_URL: http://users:8001
      APP_CONFIG__SERVICES__PRODUCTS_URL: http://products:8002
      APP_CONFIG__LOG__DIR: /logs
      PYTHONPATH: /app
    volumes:
      - ./logs:/logs:z
    ports:
      - "${ORDERS_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_healthy
      products:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devops_network

  gateway:
    image: nginx:alpine
    container_name: devops_gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - devops_network

  db_backup:
    image: postgres:16-alpine
    container_name: devops_db_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      POSTGRES_MULTIPLE_DATABASES: "users_db,products_db,orders_db"
    volumes:
      - ./backups:/backups:z
      - ./logs:/var/log:z
      - ./scripts/pg_backup_rotated.sh:/pg_backup_rotated.sh:ro,z
    entrypoint: ["/bin/sh", "-c", "export -p > /etc/environment && echo \"0 * * * * /bin/sh /pg_backup_rotated.sh >> /var/log/backup.log 2>&1\" | crontab - && crond -f -l 2"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops_network

volumes:
  postgres_data:
  redis_data:

networks:
  devops_network:
    driver: bridge
