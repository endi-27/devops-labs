{{- if not .Values.users.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: users-secret
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: users
    app.kubernetes.io/name: users
type: Opaque
stringData:
  {{- range $key, $value := .Values.users.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
