apiVersion: v1
kind: Service
metadata:
  name: users
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: users
    app.kubernetes.io/name: users
spec:
  type: {{ .Values.users.service.type | default "ClusterIP" }}
  selector:
    app: users
  ports:
    - name: http
      port: {{ .Values.users.service.port }}
      targetPort: {{ .Values.users.service.port }}
