apiVersion: v1
kind: Secret
metadata:
  name: orders-secret
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: orders
    app.kubernetes.io/name: orders
type: Opaque
stringData:
  {{- range $key, $value := .Values.orders.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
