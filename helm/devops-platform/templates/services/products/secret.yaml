{{- if not .Values.products.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: products-secret
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: products
    app.kubernetes.io/name: products
type: Opaque
stringData:
  {{- range $key, $value := .Values.products.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
