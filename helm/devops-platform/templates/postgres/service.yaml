apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: postgres
    app.kubernetes.io/name: postgres
spec:
  type: {{ .Values.postgres.service.type | default "ClusterIP" }}
  selector:
    app: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: 5432
