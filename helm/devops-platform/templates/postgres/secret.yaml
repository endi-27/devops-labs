apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: postgres
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  {{- range $key, $val := .Values.postgres.secret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
