apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: redis
    app.kubernetes.io/name: redis
spec:
  type: {{ .Values.redis.service.type | default "ClusterIP" }}
  selector:
    app: redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port | default 6379 }}
      targetPort: 6379
