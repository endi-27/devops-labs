apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
    app: gateway
    app.kubernetes.io/name: gateway
spec:
  type: {{ .Values.gateway.service.type | default "NodePort" }}
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port | default 8000 }}
      targetPort: {{ .Values.gateway.service.port | default 8000 }}
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
